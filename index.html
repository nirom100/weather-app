  <body>
    <div id="app">
      <!-- Loading Screen -->
      <div class="loading" id="loading">
        <div class="ldr-rain-ripple" role="status" aria-label="Loading">
          <span style="--x: 24%; --y: 34%; --d: 0s"></span>
          <span style="--x: 68%; --y: 24%; --d: -0.5s"></span>
          <span style="--x: 46%; --y: 72%; --d: -1s"></span>
          <span style="--x: 78%; --y: 66%; --d: -1.5s"></span>
        </div>
        <p>Loading...</p>
      </div>
      <!-- Current Weather View -->

        <h2 class="current-weather__city"></h2>
        <h1 class="current-weather__temp"></h1>
        <p class="current-weather__description"></p>
        <div class="current-weather__day-forecast">
          <p class="current-weather__min-temp"></p>
          <p class="current-weather__max-temp"></p>
        </div>
      </div>
